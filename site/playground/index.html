<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Nexus UI sandbox</title>
    <link rel="icon" href="data:,">
    <style>
      html { background: #09090b; color-scheme: dark; }
      body { margin: 0; padding: 24px; }
      main { max-width: 1400px; margin: 0 auto; }
      @media (max-width: 600px) { body { padding: 12px; } }
    </style>
  </head>
  <body>
    <main id="playground"></main>
    <script type="module">
      import { mount } from '/src/index.ts';

      const query = new URLSearchParams(location.search);
      mount(document.getElementById('playground'), {
        example: query.get('example') ?? undefined,
        compact: query.has('compact'),
        height: query.get('height') ?? 'min(760px, calc(100vh - 48px))',
      });
    </script>
  </body>
</html>
